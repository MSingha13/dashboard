      #orbitSelect {

        font-weight: 600;
        outline: none;
        cursor: pointer;
      }
      .orbit-btn {
        background: #059669;
        color: white;
        border: none;
        padding: 4px 10px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .orbit-btn:hover {
        background: #10b981;
      }
      #statusBadge {
        background: rgba(16, 185, 129, 0.2);
        color: #34d399;
        padding: 2px 7px;
        border-radius: 6px;
        font-size: 10px;
        font-weight: bold;
        border: 1px solid rgba(52, 211, 153, 0.3);

  <body onload="onLoad()">
    <div id="orbitControlBar">
      <span style="font-weight: 700; color: #34d399; display: flex; align-items: center; gap: 4px;">
        🛰️ วงโคจร Globalstar:
      </span>
      <select id="orbitSelect" onchange="handleSelectOrbit(this.value)"></select>
      <button class="orbit-btn" onclick="triggerOrbit()">วาดวงโคจร</button>
      <button class="orbit-btn" style="background: #0284c7;" onclick="focusThailand()">🇹🇭 โฟกัสไทย</button>
      <span id="statusBadge">28 ดวง</span>
    </div>

    <div id="map"></div>

    <script async defer
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDQwfOCVDASdcDtYlGhwDR10vf0D5CbaSU&callback=initMap&libraries=geometry">
    </script>

    <script>
      function populateOrbitSelector() {
        var sel = document.getElementById('orbitSelect');
        if (!sel || !Array.isArray(TLE)) return;
        sel.innerHTML = '';
        for (var i = 0; i < TLE.length; i++) {
          var opt = document.createElement('option');
          opt.value = i;
          opt.textContent = TLE[i].name;
          sel.appendChild(opt);
        }
      }

      function handleSelectOrbit(index) {
        var sat = TLE[index];
        if (!sat) return;
        if (typeof displayOrbit === 'function') {
          displayOrbit(sat);
        }
      }

      function triggerOrbit() {
        var sel = document.getElementById('orbitSelect');
        if (sel) handleSelectOrbit(sel.value);
      }

      function focusThailand() {
        if (typeof map !== 'undefined' && map) {
          map.setCenter({ lat: 18.835, lng: 99.4715 });
          map.setZoom(5);
        }
      }

      window.addEventListener('load', function() {
        populateOrbitSelector();

        var checkInterval = setInterval(function() {
          if (typeof map !== 'undefined' && map && typeof google !== 'undefined') {
            clearInterval(checkInterval);
            focusThailand();

            // Automatically display orbit for first Globalstar satellite or M083
            setTimeout(function() {
              var targetIdx = 0;
              for (var j = 0; j < TLE.length; j++) {
                if (TLE[j].name.indexOf('M083') !== -1 || TLE[j].name.indexOf('M074') !== -1) {
                  targetIdx = j;
                  break;
                }
              }
              var sel = document.getElementById('orbitSelect');
              if (sel) sel.value = targetIdx;
              handleSelectOrbit(targetIdx);
            }, 1000);
          }
        }, 500);
      });
    </script>
  </body>
